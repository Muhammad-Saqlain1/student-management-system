<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
</head>
<body>

    <h1>Student Management System</h1>

    <h2>Add / Update Student</h2>

    <input type="hidden" id="studentId">

    <input type="text" id="name" placeholder="Enter name">
    <input type="email" id="email" placeholder="Enter email">
    <input type="number" id="age" placeholder="Enter age">
    <input type="number" id="marks" placeholder="Enter marks">

    <button onclick="saveStudent()">Save Student</button>
    <button onclick="clearForm()">Clear</button>

    <br><br>

    <input type="text" id="search" placeholder="Search student" onkeyup="searchStudents()">

    <h2>Student List</h2>

    <table border="1" cellpadding="10">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Age</th>
                <th>Marks</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="studentTable"></tbody>
    </table>

    <script>
        let students = [];

        async function getStudents() {
            try {
                let response = await fetch("/api/students");
                students = await response.json();

                displayStudents(students);
            } catch (error) {
                console.log("Error:", error);
            }
        }

        function displayStudents(data) {
            let table = document.getElementById("studentTable");

            table.innerHTML = "";

            data.forEach(function(student) {
                table.innerHTML += `
                    <tr>
                        <td>${student.id}</td>
                        <td>${student.name}</td>
                        <td>${student.email}</td>
                        <td>${student.age}</td>
                        <td>${student.marks}</td>
                        <td>
                            <button onclick="editStudent(${student.id})">Edit</button>
                            <button onclick="deleteStudent(${student.id})">Delete</button>
                        </td>
                    </tr>
                `;
            });
        }

        async function saveStudent() {
            let id = document.getElementById("studentId").value;
            let name = document.getElementById("name").value;
            let email = document.getElementById("email").value;
            let age = document.getElementById("age").value;
            let marks = document.getElementById("marks").value;

            if (name === "" || email === "" || age === "" || marks === "") {
                alert("Please fill all fields");
                return;
            }

            let url = "/api/students";
            let method = "POST";

            if (id !== "") {
                url = "/api/students/" + id;
                method = "PUT";
            }

            try {
                let response = await fetch(url, {
                    method: method,
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        name: name,
                        email: email,
                        age: Number(age),
                        marks: Number(marks)
                    })
                });

                let result = await response.json();

                if (!response.ok) {
                    alert(result.message);
                    return;
                }

                alert(id === "" ? "Student added successfully" : "Student updated successfully");

                clearForm();
                getStudents();
            } catch (error) {
                alert("Server error");
                console.log(error);
            }
        }

        function editStudent(id) {
            let student = students.find(function(item) {
                return item.id === id;
            });

            if (!student) {
                return;
            }

            document.getElementById("studentId").value = student.id;
            document.getElementById("name").value = student.name;
            document.getElementById("email").value = student.email;
            document.getElementById("age").value = student.age;
            document.getElementById("marks").value = student.marks;
        }

        async function deleteStudent(id) {
            let confirmDelete = confirm("Do you want to delete this student?");

            if (!confirmDelete) {
                return;
            }

            try {
                let response = await fetch("/api/students/" + id, {
                    method: "DELETE"
                });

                let result = await response.json();

                if (!response.ok) {
                    alert(result.message);
                    return;
                }

                alert(result.message);
                getStudents();
            } catch (error) {
                alert("Server error");
                console.log(error);
            }
        }

        function searchStudents() {
            let search = document.getElementById("search").value.toLowerCase();

            let filteredStudents = students.filter(function(student) {
                return (
                    student.name.toLowerCase().includes(search) ||
                    student.email.toLowerCase().includes(search)
                );
            });

            displayStudents(filteredStudents);
        }

        function clearForm() {
            document.getElementById("studentId").value = "";
            document.getElementById("name").value = "";
            document.getElementById("email").value = "";
            document.getElementById("age").value = "";
            document.getElementById("marks").value = "";
        }

        getStudents();
    </script>

</body>
</html>
